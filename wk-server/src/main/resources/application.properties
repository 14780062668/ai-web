spring.application.name=wk-server
server.port=8080

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/wk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=wk
spring.datasource.password=wk123456
# validate：只校验表结构不建表，表与索引由 schema.sql 维护，防止实体改动被自动同步到库
spring.jpa.hibernate.ddl-auto=validate

# 登录账号与令牌配置：生产环境应改为环境变量注入
app.auth.username=admin
app.auth.password=admin123
app.auth.secret=wk-dev-secret-change-me
# 令牌有效期 1 天（毫秒）
app.auth.ttl-ms=86400000
